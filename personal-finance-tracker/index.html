<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Personal Finance Tracker</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Personal Finance Tracker</h1>
      <p class="tagline">Store the entries. Calculate the totals.</p>
    </header>

    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab-btn" data-tab="dashboard" role="tab" aria-selected="true">Dashboard</button>
      <button class="tab-btn" data-tab="income-expenses" role="tab" aria-selected="false">Income &amp; Expenses</button>
      <button class="tab-btn" data-tab="investments" role="tab" aria-selected="false">Investments</button>
      <button class="tab-btn" data-tab="watchlist" role="tab" aria-selected="false">Stocks to Watch</button>
    </nav>

    <main id="app-root" aria-live="polite"></main>

    <footer class="app-footer">
      <p>All data stays in your browser's <code>localStorage</code>. Nothing is sent anywhere.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
